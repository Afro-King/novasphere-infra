name: Terraform PR

on:
  pull_request:
    paths: ["envs/**", "modules/**", ".github/workflows/**"]

# Le GITHUB_TOKEN n'a que la lecture par defaut : tout ce qui ecrit se declare.
permissions:
  id-token: write      # demander un jeton OIDC (mode OIDC)
  contents: read       # lire le depot
  pull-requests: write # poster le plan en commentaire

jobs:
  plan:
    name: plan-${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    concurrency: terraform-${{ matrix.env }} # jamais deux runs sur le meme state
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      # Cible : OIDC, credentials temporaires (1 h), aucun secret stocke
      - name: AWS (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # Learner Lab : OIDC interdit => credentials TEMPORAIRES du lab (expirent avec la session)
      - name: AWS (Learner Lab)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=120s | tee plan.txt

      - name: Commenter le plan dans la PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = `envs/${process.env.ENV_NAME}/plan.txt`;
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'plan indisponible';
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['(voir le log)'])[0];
            if (plan.length > 60000) plan = '... (tronque)\n' + plan.slice(-60000);
            const body = [
              `### Terraform plan — \`${process.env.ENV_NAME}\` — ${process.env.OUTCOME === 'success' ? 'OK' : 'ECHEC'}`,
              `**${summary}**`,
              '<details><summary>Plan complet</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `_Run ${context.runId}, commit ${context.sha.substring(0, 7)}_`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
